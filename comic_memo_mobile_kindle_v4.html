}

/* Page annotations */
.stage{position:relative}
.bubbleLayer{position:absolute;z-index:11;pointer-events:none;overflow:hidden}
.comicBubble{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;overflow:hidden;padding:8px;background:#fff;color:#111;border:2px solid #181818;border-radius:50%;pointer-events:auto;writing-mode:vertical-rl;text-orientation:mixed;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.15}
.comicBubble[data-shape="rectangle"]{border-radius:4px}
.bubbleText{cursor:text;min-inline-size:0;max-inline-size:100%}
.bubbleText[contenteditable]{min-inline-size:1em;min-block-size:1em;outline:none;user-select:text;caret-color:#111}
.bubbleResizeHandle{position:absolute;z-index:1;width:24px;height:24px;padding:0;border:0;background:transparent;transform:translate(-100%,-100%);pointer-events:auto;touch-action:none;cursor:nwse-resize}
.bubbleResizeHandle:hover{background:transparent}
.bubbleResizeHandle::after{content:"";display:block;position:absolute;right:0;bottom:0;width:14px;height:14px;background:#ffdb29;border:2px solid #302600;border-radius:2px}
.annotationTools [data-bubble-undo]:disabled{display:inline-block}
.comicBubble{touch-action:none;cursor:grab;user-select:none}
.comicBubble:active{cursor:grabbing}
.comicBubble .bubbleText:not([contenteditable]){cursor:inherit}
.comicBubble:hover{background:#fff}
body:not(.bubbleSettingsOpen) .comicBubble[aria-pressed="true"]{outline:3px solid #437ef0;outline-offset:-3px}
.annotationTools{display:flex;gap:5px;flex-wrap:wrap}
.annotationTools button[aria-pressed="true"]{background:#345b9b;border-color:#8ab0f4}
.annotationTools button:disabled{display:none}

.memoOpacity input{flex:1;min-width:65px}
.bubbleBackdrop{position:fixed;inset:0;z-index:41;background:#0004;opacity:0;pointer-events:none;transition:opacity .2s}
.bubbleSettings{position:fixed;inset:0 auto 0 0;width:min(70vw,400px);z-index:42;display:flex;flex-direction:column;gap:12px;overflow:auto;padding:14px;background:#1b1e25f2;box-shadow:5px 0 24px #0008;transform:translateX(-105%);visibility:hidden;transition:transform .23s ease,visibility 0s .23s}

  .bubbleSettings input,.bubbleSettings textarea,.bubbleSettings select{font-size:16px}
}

const stage=$('stage');
const bubbleFonts={
  gothic:'"Noto Sans JP", sans-serif',
  mincho:'"Noto Serif JP", "Yu Mincho", serif',
  rounded:'"Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", system-ui, sans-serif'

let readerMode='memo', activeBubble=null, memoTransparency=14, nextBubbleStyle;
const bounded=(value,min,max,fallback)=>Number.isFinite(value)?Math.min(max,Math.max(min,value)):fallback;

function readBubbleStyle(item={}){
  return {
    width:bounded(item.width,...bubbleNumbers.width),
    height:bounded(item.height,...bubbleNumbers.height),
    borderWidth:bounded(item.borderWidth,...bubbleNumbers.borderWidth),
    padding:bounded(item.padding,...bubbleNumbers.padding),
    textAlign:['start','center','end'].includes(item.textAlign)?item.textAlign:'center',
    shape:item.shape==='rectangle'?'rectangle':'ellipse',
    size:bounded(item.size,...bubbleNumbers.size),
    font:Object.hasOwn(bubbleFonts,item.font)?item.font:'gothic'
  };
}

function readBubbles(value){
  if(!Array.isArray(value))return [];
  return value.filter(item=>item&&typeof item==='object').map(item=>({
    ...readBubbleStyle(item),
    x:bounded(item.x,0,1,.5),
    y:bounded(item.y,0,1,.5),
    text:typeof item.text==='string'?item.text:''
  }));
}

function setMemoTransparency(value){
  memoTransparency=bounded(value,0,85,14);
  document.body.style.setProperty('--memo-opacity',1-memoTransparency/100);
  $('memoOpacity').value=memoTransparency;
  $('memoOpacityValue').value=memoTransparency+'%';
}
$('memoOpacity').oninput=()=>{
  setMemoTransparency($('memoOpacity').valueAsNumber);
  mark(false);
};

const bubbleUndo=[];
const bubbleUndoLimit=10;
let inlineBubbleEdit=null;

function rememberBubbleEdit(page){
  bubbleUndo.push({page,bubbles:(page.bubbles||[]).map(bubble=>({...bubble}))});
  if(bubbleUndo.length>bubbleUndoLimit)bubbleUndo.shift();
}

document.querySelectorAll('[data-bubble-undo]').forEach(button=>{
  button.onclick=()=>{
    finishInlineBubbleEdit();
    const step=bubbleUndo.pop();
    if(!step)return;
    const {page,bubbles}=step;
    page.bubbles=bubbles;
    selected=pages.indexOf(page);
    activeBubble=null;
    mark(false);
    render();
  };
});

function syncBubbleTools(){
  for(let i=bubbleUndo.length-1;i>=0;i--){
    if(!pages.includes(bubbleUndo[i].page))bubbleUndo.splice(i,1);
  }
  document.querySelectorAll('[data-bubble-undo]').forEach(button=>{
    button.disabled=bubbleUndo.length===0;
  });
  document.querySelectorAll('[data-mode]').forEach(button=>{
    button.setAttribute('aria-pressed',String(button.dataset.mode===readerMode));
  });
  document.querySelectorAll('[data-bubble-settings],[data-bubble-delete]').forEach(button=>{
    button.disabled=!activeBubble;
  });
}

function closeBubbleSettings(){
  backdropPointer=null;
  document.body.classList.remove('bubbleSettingsOpen');
  $('bubbleSettings').inert=true;
}
function openBubbleSettings(){
  if(!activeBubble)return;
  $('bubbleShape').value=activeBubble.shape;
  $('bubbleWidth').value=Number(activeBubble.width.toFixed(2));
  $('bubbleHeight').value=Number(activeBubble.height.toFixed(2));
  $('bubbleSize').value=activeBubble.size;
  $('bubbleBorderWidth').value=activeBubble.borderWidth;
  $('bubblePadding').value=activeBubble.padding;
  $('bubbleTextAlign').value=activeBubble.textAlign;
  $('bubbleFont').value=activeBubble.font;
  document.body.classList.add('bubbleSettingsOpen','controlsVisible');
  $('bubbleDefaultsStatus').value='';
  $('bubbleSettings').inert=false;
}
$('saveBubbleDefaults').onclick=()=>{
  if(!activeBubble)return;
  nextBubbleStyle=readBubbleStyle(activeBubble);
  mark(false);
  $('bubbleDefaultsStatus').value='次の吹き出しに適用します';
};
$('closeBubbleSettings').onclick=closeBubbleSettings;
const bubbleBackdrop=$('bubbleBackdrop');
let backdropPointer=null;
bubbleBackdrop.onpointerdown=event=>{backdropPointer=event.pointerId};
bubbleBackdrop.onpointercancel=()=>{backdropPointer=null};
bubbleBackdrop.onclick=event=>{
  if(backdropPointer!==null&&event.pointerId===backdropPointer)closeBubbleSettings();
  backdropPointer=null;
};
document.querySelectorAll('[data-bubble-settings]').forEach(button=>button.onclick=openBubbleSettings);
document.querySelectorAll('[data-bubble-delete]').forEach(button=>{
  button.onclick=()=>{
    finishInlineBubbleEdit();
    const page=pages[selected];
    const index=page?.bubbles?.indexOf(activeBubble)??-1;
    if(index<0)return;
    resetBubbleClicks();
    rememberBubbleEdit(page);
    page.bubbles.splice(index,1);
    activeBubble=null;
    closeBubbleSettings();
    syncBubbleTools();
    paintBubbles();
    mark(false);
  };
});
function setReaderMode(mode){
  finishInlineBubbleEdit();
  resetBubbleClicks();
  readerMode=mode;
  document.body.dataset.readerMode=mode;
  activeBubble=null;
  closeBubbleSettings();
  syncBubbleTools();
  paintBubbles();
}
document.querySelectorAll('[data-mode]').forEach(button=>{
  button.onclick=()=>setReaderMode(button.dataset.mode);
});
const bubbleNumbers={size:[10,48,18],width:[8,90,18],height:[8,90,18],borderWidth:[0,12,2],padding:[0,40,8]};
for(const [field,id] of Object.entries({shape:'bubbleShape',size:'bubbleSize',font:'bubbleFont',width:'bubbleWidth',height:'bubbleHeight',borderWidth:'bubbleBorderWidth',padding:'bubblePadding',textAlign:'bubbleTextAlign'})){
  $(id).addEventListener('change',event=>{
    if(!activeBubble)return;
    const input=event.target;
    const limits=bubbleNumbers[field];
    const value=limits?bounded(input.valueAsNumber,...limits):input.value;
    if(limits)input.value=value;
    if(activeBubble[field]===value)return;
    rememberBubbleEdit(pages[selected]);
    activeBubble[field]=value;
    $('bubbleDefaultsStatus').value='';
    syncBubbleTools();
    paintBubbles();
    mark(false);
  });
}

function saveInlineBubbleText(){
  if(!inlineBubbleEdit)return;
  const edit=inlineBubbleEdit;
  const value=edit.text.innerText;
  if(value===edit.bubble.text)return;
  if(!edit.changed){
    rememberBubbleEdit(edit.page);
    edit.changed=true;
  }
  edit.bubble.text=value;
  mark(false);
  syncBubbleTools();
}

function finishInlineBubbleEdit(){
  if(!inlineBubbleEdit)return;
  saveInlineBubbleText();
  const {editor,button,bubble}=inlineBubbleEdit;
  inlineBubbleEdit=null;
  button.querySelector('.bubbleText').textContent=bubble.text||'…';
  button.setAttribute('aria-label',bubble.text||'空の吹き出し');
  editor.replaceWith(button);
}

function startInlineBubbleEdit(x,y){
  const page=pages[selected];
  const index=page?.bubbles?.indexOf(activeBubble);
  const button=stage.querySelector(`.comicBubble[data-page-index="${selected}"][data-bubble-index="${index}"]`);
  if(!button)return;
  const editor=document.createElement('div');
  editor.className=button.className;
  editor.style.cssText=button.style.cssText;
  editor.dataset.shape=button.dataset.shape;
  editor.dataset.pageIndex=selected;
  editor.dataset.bubbleIndex=index;
  editor.setAttribute('aria-pressed','true');
  const text=document.createElement('span');
  text.className='bubbleText';
  text.contentEditable='plaintext-only';
  text.setAttribute('role','textbox');
  text.setAttribute('aria-label','吹き出しの文字');
  text.setAttribute('aria-multiline','true');
  text.textContent=activeBubble.text;
  editor.append(text);
  inlineBubbleEdit={page,bubble:activeBubble,editor,button,text,changed:false};
  text.addEventListener('input',saveInlineBubbleText);
  text.addEventListener('blur',finishInlineBubbleEdit);
  text.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!event.isComposing){
      event.preventDefault();
      text.blur();
    }
  });
  button.replaceWith(editor);
  text.focus({preventScroll:true});
  const caret=document.caretPositionFromPoint?.(x,y);
  const range=document.createRange();
  range.selectNodeContents(text);
  if(caret&&text.contains(caret.offsetNode)){
    range.setStart(caret.offsetNode,caret.offset);
    range.collapse(true);
  }else{
    range.collapse(false);
  }
  const selection=window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

function pageAtImage(img){
  const spreadPage=img.closest('[data-page]');
  return spreadPage?Number(spreadPage.dataset.page):selected;
}

function imageBounds(img){
  const box=img.getBoundingClientRect();
  if(!img.naturalWidth||!box.width||!box.height)return null;
  const scale=Math.min(box.width/img.naturalWidth,box.height/img.naturalHeight);
  const width=img.naturalWidth*scale,height=img.naturalHeight*scale;
  return {left:box.left+(box.width-width)/2,top:box.top+(box.height-height)/2,width,height};
}

function fitBubblePosition(center,size){
  const half=size/200;
  return bounded(center,half,1-half,.5);
}

function positionBubble(button,bubble,handle){
  const x=fitBubblePosition(bubble.x,bubble.width)*100;
  const y=fitBubblePosition(bubble.y,bubble.height)*100;
  Object.assign(button.style,{
    left:x+'%',top:y+'%',width:bubble.width+'%',height:bubble.height+'%'
  });
  if(handle){
    handle.style.left=x+bubble.width/2+'%';
    handle.style.top=y+bubble.height/2+'%';
  }
}

let bubbleDrag=null;
function paintBubbles(){
  if(bubbleDrag||inlineBubbleEdit)return;
  stage.querySelectorAll('.bubbleLayer').forEach(layer=>layer.remove());
  const stageBox=stage.getBoundingClientRect();
  for(const img of stage.querySelectorAll('img')){
    const index=pageAtImage(img);
    const bubbles=pages[index]?.bubbles;
    const box=imageBounds(img);
    if(!box||!bubbles?.length)continue;
    const layer=document.createElement('div');
    layer.className='bubbleLayer';
    Object.assign(layer.style,{
      left:box.left-stageBox.left+stage.scrollLeft+'px',
      top:box.top-stageBox.top+stage.scrollTop+'px',
      width:box.width+'px',height:box.height+'px'
    });
    bubbles.forEach((bubble,i)=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='comicBubble';
      button.dataset.pageIndex=index;
      button.dataset.bubbleIndex=i;
      button.dataset.shape=bubble.shape;
      button.setAttribute('aria-label',bubble.text||'空の吹き出し');
      button.setAttribute('aria-pressed',String(bubble===activeBubble));
      const text=document.createElement('span');
      text.className='bubbleText';
      text.textContent=bubble.text||'…';
      button.append(text);
      button.style.fontFamily=bubbleFonts[bubble.font];
      button.style.fontSize=bubble.size+'px';
      button.style.borderWidth=bubble.borderWidth+'px';
      button.style.padding=bubble.padding+'px';
      button.style.justifyItems=bubble.textAlign;
      button.style.textAlign=bubble.textAlign;
      layer.append(button);
      let handle;
      if(bubble===activeBubble){
        handle=document.createElement('button');
        handle.type='button';
        handle.className='bubbleResizeHandle';
        handle.setAttribute('aria-label','吹き出しの大きさを調整');
        handle.onclick=()=>openBubbleSettings();
        layer.append(handle);
      }
      positionBubble(button,bubble,handle);
    });
    stage.append(layer);
  }
}

const bubbleResize=new ResizeObserver(paintBubbles);
function mountBubbles(keepStage){
  if(!pages[selected]?.bubbles?.includes(activeBubble)){
    activeBubble=null;
    closeBubbleSettings();
  }
  syncBubbleTools();
  if(!keepStage){
    bubbleResize.disconnect();
    bubbleResize.observe(stage);
    stage.querySelectorAll('img').forEach(img=>{
      img.addEventListener('load',paintBubbles,{once:true});
      bubbleResize.observe(img);
    });
  }
  paintBubbles();
}

const bubbleClickWindow=350;
let bubbleClicks=null;

function resetBubbleClicks(){
  if(bubbleClicks)clearTimeout(bubbleClicks.timer);
  bubbleClicks=null;
}

function selectBubbleByClick(bubble,index,event){
  const now=performance.now();
  const previous=bubbleClicks;
  const sameClick=previous?.bubble===bubble&&now-previous.time<=bubbleClickWindow
    &&Math.hypot(event.clientX-previous.x,event.clientY-previous.y)<=24;
  const count=sameClick?previous.count+1:1;
  resetBubbleClicks();
  selected=index;
  activeBubble=bubble;
  document.body.classList.add('controlsVisible');
  render(true);
  if(count===3){
    openBubbleSettings();
    return;
  }

  const click={bubble,count,time:now,x:event.clientX,y:event.clientY,timer:null};
  bubbleClicks=click;
  if(count===2){
    click.timer=setTimeout(()=>{
      if(bubbleClicks!==click)return;
      resetBubbleClicks();
      if(activeBubble===bubble&&pages[selected]?.bubbles?.includes(bubble)
        &&!document.body.classList.contains('detailOpen')&&$('bubbleSettings').inert){
        startInlineBubbleEdit(click.x,click.y);
      }
    },bubbleClickWindow);
  }
}

function imageHit(event){
  const img=event.target.closest('img');
  const box=img&&imageBounds(img);
  if(!box||event.clientX<box.left||event.clientX>box.left+box.width
    ||event.clientY<box.top||event.clientY>box.top+box.height)return null;
  return {img,box};
}

let stageClickStartedOnBubble=false;
let outsideTap=null;
let outsideTapHandled=false;
stage.addEventListener('pointerdown',event=>{
  const handle=event.target.closest('.bubbleResizeHandle');
  const button=handle?handle.previousElementSibling:event.target.closest('.comicBubble');
  if(event.target.closest('[contenteditable]'))return;
  if(!event.isPrimary||event.button!==0)return;
  stageClickStartedOnBubble=!!button;
  outsideTapHandled=false;
  outsideTap=readerMode==='place'&&!button&&!imageHit(event)
    ? {id:event.pointerId,x:event.clientX,y:event.clientY}
    : null;
  if(!button||bubbleDrag)return;
  const index=Number(button.dataset.pageIndex);
  const bubble=pages[index].bubbles[Number(button.dataset.bubbleIndex)];
  const box=button.parentElement.getBoundingClientRect();
  const visibleHandle=button.nextElementSibling;
  bubbleDrag={
    id:event.pointerId,index,bubble,button,box,handle,
    visibleHandle:visibleHandle?.matches('.bubbleResizeHandle')?visibleHandle:null,
    startX:event.clientX,startY:event.clientY,
    x:fitBubblePosition(bubble.x,bubble.width),y:fitBubblePosition(bubble.y,bubble.height)
  };
  if(handle)event.preventDefault();
  stage.setPointerCapture(event.pointerId);
});

function bubbleDragGeometry(drag,dx,dy){
  const {bubble,box,x,y,handle}=drag;
  if(handle){
    const left=x-bubble.width/200,top=y-bubble.height/200;
    const width=bounded(bubble.width+dx/box.width*100,8,Math.min(90,(1-left)*100),bubble.width);
    const height=bounded(bubble.height+dy/box.height*100,8,Math.min(90,(1-top)*100),bubble.height);
    return {x:left+width/200,y:top+height/200,width,height};
  }
  return {
    x:fitBubblePosition(x+dx/box.width,bubble.width),
    y:fitBubblePosition(y+dy/box.height,bubble.height),
    width:bubble.width,height:bubble.height
  };
}

window.addEventListener('pointermove',event=>{
  if(!bubbleDrag||event.pointerId!==bubbleDrag.id)return;
  const drag=bubbleDrag;
  positionBubble(drag.button,bubbleDragGeometry(drag,event.clientX-drag.startX,event.clientY-drag.startY),
    drag.visibleHandle);
});

function finishBubbleDrag(event){
  if(!bubbleDrag||event.pointerId!==bubbleDrag.id)return;
  const drag=bubbleDrag;
  bubbleDrag=null;
  if(event.type==='pointerup'){
    selected=drag.index;
    activeBubble=drag.bubble;
    const dx=event.clientX-drag.startX,dy=event.clientY-drag.startY;
    const moved=Math.hypot(dx,dy)>=5;
    if(!moved&&!drag.handle){
      selectBubbleByClick(drag.bubble,drag.index,event);
      return;
    }
    if(moved){
      resetBubbleClicks();
      const geometry=bubbleDragGeometry(drag,dx,dy);
      if(Object.keys(geometry).some(key=>geometry[key]!==activeBubble[key])){
        rememberBubbleEdit(pages[selected]);
        Object.assign(activeBubble,geometry);
        mark(false);
      }
    }
    render(true);
    return;
  }
  paintBubbles();
}
window.addEventListener('pointerup',finishBubbleDrag);
window.addEventListener('pointercancel',finishBubbleDrag);
stage.addEventListener('lostpointercapture',finishBubbleDrag);

stage.addEventListener('pointerup',event=>{
  if(outsideTap?.id!==event.pointerId)return;
  const start=outsideTap;
  outsideTap=null;
  if(readerMode!=='place'||stageClickStartedOnBubble||imageHit(event)
    ||Math.hypot(event.clientX-start.x,event.clientY-start.y)>=8)return;
  outsideTapHandled=true;
  setReaderMode('memo');
});
stage.addEventListener('pointercancel',event=>{
  if(outsideTap?.id===event.pointerId)outsideTap=null;
});

stage.onclick=event=>{
  if(outsideTapHandled||event.target.closest('[contenteditable]'))return;
  const hit=event.target.closest('.comicBubble');
  if(hit){
    const index=Number(hit.dataset.pageIndex);
    const bubbles=pages[index].bubbles;
    const bubbleIndex=Number(hit.dataset.bubbleIndex);
    if(event.detail===0){
      resetBubbleClicks();
      selected=index;
      activeBubble=bubbles[bubbleIndex];
      document.body.classList.add('controlsVisible');
      render(true);
      startInlineBubbleEdit(event.clientX,event.clientY);
    }
    return;
  }
  if(event.target===stage&&stageClickStartedOnBubble)return;
  resetBubbleClicks();
  if(readerMode==='place'){
    const hit=imageHit(event);
    if(!hit)return;
    const {img,box}=hit;
    const x=(event.clientX-box.left)/box.width,y=(event.clientY-box.top)/box.height;
    selected=pageAtImage(img);
    const page=pages[selected];
    const style=nextBubbleStyle||readBubbleStyle();
    activeBubble={
      ...style,
      x:fitBubblePosition(x,style.width),
      y:fitBubblePosition(y,style.height),
      text:''
    };
    rememberBubbleEdit(page);
    (page.bubbles??=[]).push(activeBubble);
    mark(false);
    render(true);
    return;
  }
  const spreadPage=event.target.closest('.spreadPage');
  if(spreadPage){selected=Number(spreadPage.dataset.page);render();}
};

function openMobileDetail(){
  document.body.classList.add('detailOpen','controlsVisible');
}
function closeMobileDetail(){
  document.body.classList.remove('detailOpen');
  $('mobileDetail').classList.remove('expanded');
  $('mExpand').textContent='拡大';
}
function bindDetailSwipe(surface,{left,right}){
  let swipeStart=null;
  surface.addEventListener('touchstart',event=>{
    const touch=event.touches[0];
    swipeStart=event.touches.length===1&&!event.target.closest('input,select,[contenteditable],.bubbleResizeHandle,.comicBubble')
      ? {id:touch.identifier,x:touch.clientX,y:touch.clientY}
      : null;
  },{passive:true});
  surface.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
  surface.addEventListener('touchend',event=>{
    const start=swipeStart;
    swipeStart=null;
    if(!start||event.touches.length)return;
    const touch=Array.from(event.changedTouches).find(touch=>touch.identifier===start.id);
    if(!touch)return;
    const horizontal=touch.clientX-start.x;
    const vertical=Math.abs(start.y-touch.clientY);
    const distance=Math.abs(horizontal);
    const action=horizontal<0?left:right;
    if(!action||distance<48||distance<vertical*1.5)return;
    if(event.cancelable)event.preventDefault();
    action();
  },{passive:false});
}
const detailSwipes={left:openMobileDetail,right:openBubbleSettings};
bindDetailSwipe($('tapZones'),detailSwipes);
bindDetailSwipe(stage,detailSwipes);
bindDetailSwipe($('mobileDetail'),{right:closeMobileDetail});
bindDetailSwipe($('mBackdrop'),{right:closeMobileDetail});
bindDetailSwipe($('bubbleSettings'),{left:closeBubbleSettings});
bindDetailSwipe($('bubbleBackdrop'),{left:closeBubbleSettings});
$('mClose').onclick=$('mBackdrop').onclick=closeMobileDetail;
$('mExpand').onclick=()=>{const expanded=$('mobileDetail').classList.toggle('expanded');$('mExpand').textContent=expanded?'縮小':'拡大'};
window.addEventListener('keydown',e=>{if(e.target.closest('textarea,input,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();step(1)}if(e.key==='ArrowRight'){e.preventDefault();step(-1)}});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});restore()})();
</script></body></html>
