<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コミックメモビューア</title><style>
:root{color-scheme:dark;font-family:system-ui,'Noto Sans JP',sans-serif;background:#15171d;color:#edf0f6}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{background:#343b4b;border:1px solid #586071;color:#fff;padding:8px 12px;border-radius:7px;cursor:pointer}button:hover{background:#4b5670}button:disabled{opacity:.35;cursor:default}.primary{background:#345b9b}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #3b4050}header h1{font-size:16px;margin:0 12px 0 0}#status{font-size:12px;color:#aab5cb;margin-left:auto}.layout{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(280px,34vw);height:calc(100dvh - 61px);min-height:450px}.side{border-right:1px solid #343a49;display:flex;flex-direction:column;min-height:0}.sidehead{padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.thumbs{overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;gap:7px}.thumb{border:2px solid transparent;background:#222631;border-radius:6px;padding:4px;cursor:pointer;position:relative;text-align:center;font-size:11px}.thumb.active{border-color:#80a9ff}.thumb img{width:100%;height:100px;object-fit:contain;background:#111318}.thumb .empty{height:100px;display:grid;place-items:center;color:#8791a8}.thumb .noteDot{position:absolute;right:5px;top:5px;background:#e2ac53;border-radius:50%;width:8px;height:8px}.viewer{min-width:0;min-height:0;display:flex;flex-direction:column}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#101116;overflow:auto;padding:12px}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.stage.spread{overflow:hidden}.spreadPages{display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;height:100%;gap:3px}.spreadPage{flex:0 1 auto;min-width:0;max-width:49.5%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent;border-radius:3px}.spreadPage img{max-width:100%;max-height:100%;object-fit:contain}.spreadPage.active{border-color:#80a9ff}.spreadEmpty{width:48%;height:90%;border:1px dashed #3b4050;opacity:.5}.placeholder{color:#8791a8;text-align:center;line-height:2}.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;border-top:1px solid #343a49}.nav span{min-width:90px;text-align:center}.notes{min-height:0;display:flex;flex-direction:column;padding:12px;gap:10px;border-left:1px solid #343a49}.notes h2{font-size:15px;margin:0}.notes textarea{flex:1;min-height:120px;width:100%;resize:none;background:#20242e;border:1px solid #485062;color:#f3f5fa;border-radius:8px;padding:12px;line-height:1.65}.noteActions{display:flex;flex-wrap:wrap;gap:7px}.muted{font-size:12px;color:#a5aec1}.danger{color:#ffb8b8}input[type=file]{display:none}dialog{background:#252b37;color:#fff;border:1px solid #626d82;border-radius:10px;max-width:90vw}dialog::backdrop{background:#0009}.dlgButtons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:850px){.layout{grid-template-columns:95px minmax(0,1fr);grid-template-rows:minmax(330px,60%) minmax(180px,40%);height:calc(100dvh - 110px)}.side{grid-row:1/3}.thumbs{grid-template-columns:1fr}.notes{grid-column:2;grid-row:2;border-top:1px solid #343a49;border-left:0}.viewer{grid-column:2;grid-row:1}.thumb img,.thumb .empty{height:90px}header{min-height:100px}}

/* Smartphone Kindle-style reader */
.mobileTop,.mobileBottom,.mobileDetail,.mobileBackdrop,.tapZones{display:none}
@media(max-width:850px){
html,body{height:100%;overflow:hidden;background:#050505}header,.side,.nav,.notes{display:none!important}
.layout{display:block;height:100dvh;min-height:0}.viewer{height:100dvh}.stage{height:100dvh;padding:0;overflow:hidden;background:#050505}.stage img{max-width:100%;max-height:100%;object-fit:contain}.stage.spread{overflow:hidden}
.mobileTop,.mobileBottom{display:flex;position:fixed;left:0;right:0;background:rgba(0,0,0,.94);z-index:30;align-items:center;gap:7px;padding:10px max(10px,env(safe-area-inset-right));transition:transform .22s ease,opacity .22s ease;opacity:0;pointer-events:none}
.mobileTop{top:0;padding-top:max(10px,env(safe-area-inset-top));transform:translateY(-105%);flex-wrap:wrap}
.mobileBottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom));transform:translateY(105%);justify-content:center}
body.controlsVisible .mobileTop,body.controlsVisible .mobileBottom{transform:translateY(0);opacity:1;pointer-events:auto}
.mobileTop button,.mobileBottom button{background:#272727;border:1px solid #555;color:white;font-size:12px;padding:9px 10px;white-space:nowrap}
.mobileTop .grow{flex:1}.mobileTop .detailBtn{background:#31598c}
.mobileBottom input{width:64px;background:#202020;border:1px solid #777;border-radius:6px;color:white;text-align:center;padding:9px 3px;font-size:16px}.mobileBottom .total{color:#ddd;font-size:14px}
.tapZones{display:flex;position:fixed;inset:0;z-index:10;pointer-events:none}.tapZones>div{pointer-events:auto;flex:1}.tapZones .tapCenter{flex:1.3}
body.detailOpen .tapZones{pointer-events:none}body.detailOpen .tapZones>div{pointer-events:none}
.mobileBackdrop{display:block;position:fixed;inset:0;background:#0008;z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
body.detailOpen .mobileBackdrop{opacity:1;pointer-events:auto}
.mobileDetail{display:flex;flex-direction:column;position:fixed;right:0;top:0;bottom:0;width:30vw;min-width:0;background:#1b1e25;z-index:40;transform:translateX(105%);transition:transform .23s ease;padding:12px 8px max(12px,env(safe-area-inset-bottom));gap:10px;box-shadow:-5px 0 24px #0008}
body.detailOpen .mobileDetail{transform:translateX(0)}.mobileDetail .detailHead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.mobileDetail button{padding:6px;font-size:12px}.mobileDetail textarea{flex:1;min-height:0;width:100%;resize:none;background:#101318;border:1px solid #555;color:white;border-radius:6px;padding:8px;line-height:1.6;font-size:14px}
.mobileDetail.expanded{width:min(94vw,600px)}.mobileDetail .hint{font-size:10px;color:#aeb5c4}
}
</style></head><body><header><h1>📖 コミックメモ</h1><button id="add" class="primary">＋ 画像追加</button><button id="load">JSON読込</button><button id="save">JSON保存</button><button id="export">メモTXT出力</button><button id="viewMode" title="単ページと見開きを切り替え">見開き表示：OFF</button><button id="new">新規</button><span id="status">未保存</span><input type="file" id="images" accept="image/*" multiple><input type="file" id="json" accept=".json,application/json"></header><div class="layout"><aside class="side"><div class="sidehead"><b>ページ一覧</b><span id="count">0ページ</span></div><div id="thumbs" class="thumbs"></div></aside><main class="viewer"><div class="stage" id="stage"><div class="placeholder">「＋ 画像追加」から画像を登録してください<br>JSONファイルからも復元できます</div></div><div class="nav"><button id="next">← 次へ</button><span id="pageLabel">0 / 0</span><button id="prev">前へ →</button></div></main><section class="notes"><h2 id="noteTitle">ページメモ</h2><textarea id="memo" placeholder="このページのメモを入力…"></textarea><div class="noteActions"><button id="up">↑ 前へ移動</button><button id="down">↓ 後へ移動</button><button id="remove" class="danger">ページ削除</button></div><div class="muted">画像はJSONに埋め込んで保存します。大量の画像を登録するとJSONが大きくなります。自動保存はメモと表示状態のみです。画像を残すにはJSON保存してください。</div></section></div><div class="tapZones" id="tapZones"><div id="tapNext" aria-label="次のページ"></div><div id="tapToggle" class="tapCenter" aria-label="操作バー表示"></div><div id="tapPrev" aria-label="前のページ"></div></div><div class="mobileTop"><button id="mLoad">JSON読込</button><button id="mSave">JSON保存</button><button id="mExport">メモTXT</button><button id="mAdd">画像追加</button><span class="grow"></span><button id="mDetail" class="detailBtn">詳細</button></div><div class="mobileBottom"><button id="mNext">←</button><span>ページ</span><input id="mPage" type="number" inputmode="numeric" min="1" value="1" aria-label="ページ番号"><span class="total" id="mTotal">/ 0</span><button id="mGo">移動</button><button id="mPrev">→</button></div><div class="mobileBackdrop" id="mBackdrop"></div><section class="mobileDetail" id="mobileDetail"><div class="detailHead"><b id="mNoteTitle">ページメモ</b><button id="mExpand">拡大</button><button id="mClose">閉じる</button></div><textarea id="mMemo" placeholder="このページのメモを入力…"></textarea><span class="hint">入力内容はJSON保存で画像と一緒に出力されます</span></section><dialog id="confirm"><div id="confirmText"></div><div class="dlgButtons"><button id="cancelConfirm">キャンセル</button><button id="okConfirm" class="danger">実行</button></div></dialog><script>
(()=>{'use strict';let pages=[],selected=0,dirty=false,projectName='',spread=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);function status(s){$('status').textContent=s}function mark(){dirty=true;status('● 未保存');sessionStorage.setItem('comicMemoDraft',JSON.stringify({selected,notes:pages.map(p=>({id:p.id,memo:p.memo}))}))}function groupFor(i){if(!spread)return [i];if(i===0)return [0];const start=1+2*Math.floor((i-1)/2);return [start,start+1].filter(n=>n<pages.length)}function step(dir){if(!pages.length)return;const group=groupFor(selected);const target=dir>0?group[group.length-1]+1:group[0]-1;if(target>=0&&target<pages.length){selected=target;render()}}function render(){selected=Math.max(0,Math.min(selected,pages.length-1));$('count').textContent=pages.length+'ページ';const group=pages.length?groupFor(selected):[];$('pageLabel').textContent=pages.length?`${group.map(i=>i+1).join('・')} / ${pages.length}`:'0 / 0';$('viewMode').textContent=spread?'見開き表示：ON':'見開き表示：OFF';$('viewMode').classList.toggle('primary',spread);$('thumbs').innerHTML=pages.map((p,i)=>`<div class="thumb ${i===selected?'active':''}" data-index="${i}" draggable="true" title="ドラッグで並べ替え"><div>${i+1}ページ</div>${p.image?`<img src="${p.image}" alt="${esc(p.name||'ページ画像')}">`:'<div class="empty">画像なし</div>'}${p.memo?'<span class="noteDot"></span>':''}</div>`).join('');const p=pages[selected];$('stage').classList.toggle('spread',spread);$('stage').innerHTML=spread&&p?`<div class="spreadPages">${(group.length===1?[-1,...group]:[...group].reverse()).map(i=>i<0?'<div class="spreadEmpty"></div>':`<div class="spreadPage ${i===selected?'active':''}" data-page="${i}" title="${i+1}ページのメモを編集">${pages[i].image?`<img src="${pages[i].image}" alt="${esc(pages[i].name||'ページ画像')}">`:'画像なし'}</div>`).join('')}</div>`:p?.image?`<img src="${p.image}" alt="${esc(p.name||'ページ画像')}">`:'<div class="placeholder">「＋ 画像追加」から画像を登録してください<br>JSONファイルからも復元できます</div>';$('memo').disabled=!p;$('memo').value=p?.memo||'';$('mMemo').value=p?.memo||'';$('mNoteTitle').textContent=p?`${selected+1}ページのメモ`:'ページメモ';$('mPage').value=pages.length?selected+1:'';$('mPage').max=pages.length;$('mTotal').textContent='/ '+pages.length;$('noteTitle').textContent=p?`ページ ${selected+1} のメモ`:'ページメモ';for(const id of ['prev','next','up','down','remove'])$(id).disabled=!p||(id==='prev'&&group[0]===0)||(id==='next'&&group[group.length-1]===pages.length-1)||(id==='up'&&selected===0)||(id==='down'&&selected===pages.length-1);$('thumbs').querySelector('.active')?.scrollIntoView({block:'nearest'});}function move(a,b){if(b<0||b>=pages.length||a===b)return;const [p]=pages.splice(a,1);pages.splice(b,0,p);selected=b;mark();render()}function fileRead(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function ask(message,action){$('confirmText').textContent=message;$('confirm').showModal();$('okConfirm').onclick=()=>{$('confirm').close();action()}}$('cancelConfirm').onclick=()=>$('confirm').close();$('add').onclick=()=>$('images').click();$('images').onchange=async e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;try{const entries=await Promise.all(files.map(async f=>({id:uid(),name:f.name,image:await fileRead(f),memo:''})));pages.splice(pages.length,0,...entries);selected=pages.length-entries.length;mark();render()}catch(err){alert('画像読込に失敗しました: '+err.message)}e.target.value=''};$('thumbs').onclick=e=>{const el=e.target.closest('.thumb');if(el){selected=+el.dataset.index;render()}};let drag=-1;$('thumbs').ondragstart=e=>{const el=e.target.closest('.thumb');if(el){drag=+el.dataset.index;e.dataTransfer.effectAllowed='move'}};$('thumbs').ondragover=e=>{if(e.target.closest('.thumb'))e.preventDefault()};$('thumbs').ondrop=e=>{const el=e.target.closest('.thumb');if(el&&drag>=0){e.preventDefault();move(drag,+el.dataset.index)}drag=-1};$('mMemo').oninput=e=>{if(!pages[selected])return;pages[selected].memo=e.target.value;$('memo').value=e.target.value;mark()};$('memo').oninput=e=>{if(!pages[selected])return;pages[selected].memo=e.target.value;mark();const dot=$('thumbs').querySelector(`.thumb[data-index="${selected}"] .noteDot`);if(e.target.value&&!dot){const d=document.createElement('span');d.className='noteDot';$('thumbs').querySelector('.active')?.append(d)}else if(!e.target.value)dot?.remove()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('viewMode').onclick=()=>{spread=!spread;render()};$('stage').onclick=e=>{const el=e.target.closest('[data-page]');if(el){selected=Number(el.dataset.page);render()}};$('up').onclick=()=>move(selected,selected-1);$('down').onclick=()=>move(selected,selected+1);$('remove').onclick=()=>ask(`ページ ${selected+1} を削除しますか？`,()=>{pages.splice(selected,1);mark();render()});$('new').onclick=()=>ask('現在のページとメモをすべて消して新規作成しますか？ JSON保存していない内容は失われます。',()=>{pages=[];selected=0;projectName='';mark();render()});$('save').onclick=()=>{download(JSON.stringify({format:'manga-comic-bundle',version:1,projectName:projectName||'コミックメモ',exportedAt:new Date().toISOString(),orderSource:'display',imageFormat:'image/webp',pages:pages.map((p,i)=>({pageId:p.pageId||p.id,originalPage:p.originalPage??i+1,displayPage:i+1,clipName:p.clipName||p.name||'',memo:p.memo,image:p.image,width:p.width||null,height:p.height||null}))},null,2),'comic-memo.json','application/json');dirty=false;status('✓ JSON保存済み')};$('export').onclick=()=>{const txt=pages.map((p,i)=>`【${i+1}ページ】${p.name?' '+p.name:''}\n${p.memo||'（メモなし）'}`).join('\n\n');download(txt||'メモなし','comic-memo.txt','text/plain;charset=utf-8')};$('load').onclick=()=>$('json').click();$('json').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.pages)||data.pages.length>2000)throw Error('pages配列がない、またはページ数が多すぎます');const parsed=data.pages.map((p,i)=>{if(typeof p!=='object'||p===null||typeof p.image!=='string'||(p.image&&!/^data:image\/(png|jpeg|webp|gif|avif);base64,/.test(p.image)))throw Error(`${i+1}ページ目の画像形式が不正です`);return{id:String(p.id||p.pageId||uid()),pageId:String(p.pageId||p.id||uid()),originalPage:Number(p.originalPage??i+1),name:String(p.name||p.clipName||''),clipName:String(p.clipName||p.name||''),image:p.image,memo:String(p.memo||''),width:Number(p.width||0),height:Number(p.height||0)}});ask(`${parsed.length}ページを読み込みます。現在の内容を置き換えますか？`,()=>{pages=parsed;projectName=String(data.projectName||'');selected=0;dirty=false;sessionStorage.removeItem('comicMemoDraft');status('✓ JSON読込済み：'+(projectName||f.name));render()})}catch(err){alert('JSON読込エラー: '+err.message)}e.target.value=''};$('mLoad').onclick=()=>$('load').click();$('mSave').onclick=()=>$('save').click();$('mExport').onclick=()=>$('export').click();$('mAdd').onclick=()=>$('add').click();
$('tapToggle').onclick=()=>document.body.classList.toggle('controlsVisible');$('tapNext').onclick=()=>step(1);$('tapPrev').onclick=()=>step(-1);
$('mNext').onclick=()=>step(1);$('mPrev').onclick=()=>step(-1);
function jump(){const n=Number($('mPage').value);if(Number.isInteger(n)&&n>=1&&n<=pages.length){selected=n-1;render()}else{$('mPage').value=pages.length?selected+1:''}}
$('mGo').onclick=jump;$('mPage').onkeydown=e=>{if(e.key==='Enter'){$('mPage').blur();jump()}};
$('mDetail').onclick=()=>{document.body.classList.add('detailOpen','controlsVisible')};$('mClose').onclick=()=>$('mBackdrop').onclick();$('mBackdrop').onclick=()=>{document.body.classList.remove('detailOpen');$('mobileDetail').classList.remove('expanded');$('mExpand').textContent='拡大'};
$('mExpand').onclick=()=>{const expanded=$('mobileDetail').classList.toggle('expanded');$('mExpand').textContent=expanded?'縮小':'拡大'};
window.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowLeft'){e.preventDefault();step(1)}if(e.key==='ArrowRight'){e.preventDefault();step(-1)}});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render()})();
</script></body></html>
